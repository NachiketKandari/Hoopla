{% extends "base.html" %}
{% block content %}
<h1>🗂 Dataset Viewer</h1>
<p class="caption">{{ movies|length }} movies in dataset.</p>

<div class="dataset-grid">
    {% for movie in movies %}
    <div class="movie-card">
        <h3>{{ movie.title }}</h3>
        <p>{{ movie.description[:200] }}{% if movie.description|length > 200 %}...{% endif %}</p>
    </div>
    {% endfor %}
</div>

<details>
    <summary>Raw JSON</summary>
    <pre>{{ movies_json }}</pre>
</details>
{% endblock %}
